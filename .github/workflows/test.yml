name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.opencode-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
        opencode-version: [v1, v2]
        include:
          - opencode-version: v1
            opencode-plugin: "@opencode-ai/plugin@1"
            opencode-tui-plugin: "@opencode-ai/plugin@1"
          - opencode-version: v2
            opencode-plugin: "@opencode/plugin@2"
            opencode-tui-plugin: "@opencode/plugin@2/tui"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install opencode plugin for ${{ matrix.opencode-version }}
        run: |
          if [ "${{ matrix.opencode-version }}" = "v1" ]; then
            bun add -D @opencode-ai/plugin@1
          else
            bun add -D @opencode/plugin@2
          fi

      - name: Build
        run: bun run build

      - name: Type check
        run: bun run checktypes

      - name: Lint
        run: bun run lint

      - name: Run tests
        run: bun test

      - name: Run v2-specific tests
        if: matrix.opencode-version == 'v2'
        run: bun test test/v2

  test-v1-only:
    name: Test v1 only (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun add -D @opencode-ai/plugin@1
      - run: bun run build
      - run: bun run checktypes
      - run: bun run lint
      - run: bun test

  test-v2-only:
    name: Test v2 only (Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun add -D @opencode/plugin@2
      - run: bun run build
      - run: bun run checktypes
      - run: bun run lint
      - run: bun test
      - run: bun test test/v2