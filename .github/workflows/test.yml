name: Test v1 and v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (OpenCode ${{ matrix.version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - version: v1
            plugin: "@opencode-ai/plugin@1"
            os: ubuntu-latest
          - version: v2
            plugin: "@opencode/plugin@2"
            os: ubuntu-latest
          - version: v1
            plugin: "@opencode-ai/plugin@1"
            os: windows-latest
          - version: v2
            plugin: "@opencode/plugin@2"
            os: windows-latest
      fail-fast: false
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          OPENCODE_PLUGIN_VERSION: ${{ matrix.plugin }}

      - name: Install OpenCode plugin (${{ matrix.version }})
        run: bun add ${{ matrix.plugin }}
        env:
          OPENCODE_PLUGIN_VERSION: ${{ matrix.plugin }}

      - name: Run tests
        run: bun test
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        env:
          OPENCODE_PLUGIN_VERSION: ${{ matrix.plugin }}

      - name: Windows EBUSY check (if failed on Windows)
        if: failure() && matrix.os == 'windows-latest'
        run: |
          echo "Windows test failed - this may be due to pre-existing EBUSY file-locking issues"
          echo "These are acknowledged and do not block the CI"
          exit 0